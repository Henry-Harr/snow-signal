# docker compose -f docker/docker-compose.yml --env-file ../.env up -d
#
# Two services share the image: `sentinel` runs the watch loop; `sentinel-backup`
# overrides the entrypoint to take an online SQLite backup and exits — it isn't meant
# to run continuously, so it isn't started by `up`. Schedule it from the host instead
# (cron/systemd timer): `docker compose -f docker/docker-compose.yml run --rm
# sentinel-backup` (docs/RUNBOOK.md).

services:
  sentinel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sentinel:latest
    restart: unless-stopped
    # Generous: worst case a poll iteration is mid-RPC-retry (src/chain/rpc-pool.ts's
    # DEFAULT_RETRY) across every configured chain when SIGTERM arrives — give it real
    # room to finish the current iteration and close cleanly (src/cli/watch.ts's
    # SIGINT/SIGTERM handling) rather than getting SIGKILLed mid-write.
    stop_grace_period: 30s
    env_file:
      - ../.env
    volumes:
      - ../config/sentinel.yaml:/app/config/sentinel.yaml:ro
      - sentinel-data:/data
      - sentinel-reports:/app/reports
      - sentinel-backups:/app/backups
    # Metrics/health (src/ops/health-server.ts) bind to config.ops.metricsHost, which
    # defaults to 127.0.0.1 — the *container's own* loopback, not reachable from the
    # host at all, by design (docs/THREAT_MODEL.md §1: no inbound ports beyond
    # metrics/health, and even those default to localhost-only). Publishing this port
    # is a no-op until you deliberately widen config/sentinel.yaml's ops.metricsHost to
    # 0.0.0.0 — do that first, then uncomment below (host-side still bound to
    # 127.0.0.1 only, so the port never leaves this machine even then):
    # ports:
    #   - "127.0.0.1:9469:9469"
    logging:
      driver: json-file
      options:
        # Container logs are JSON lines on stdout (pino — src/core/logger.ts); Docker's
        # own log driver handles rotation so Sentinel doesn't need a log-file library.
        max-size: '10m'
        max-file: '5'

  sentinel-backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sentinel:latest
    profiles: ['backup'] # never started by `up`; run explicitly, see header comment
    entrypoint: ['node', 'dist/cli/index.js', 'backup']
    command: ['--db', '/data/sentinel.sqlite', '--out-dir', '/app/backups', '--retain', '14']
    volumes:
      - sentinel-data:/data
      - sentinel-backups:/app/backups

volumes:
  sentinel-data:
  sentinel-reports:
  sentinel-backups:
