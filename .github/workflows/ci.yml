name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  # Fork/integration tests need real RPC access (spec docs/SPEC.md #4). They run only
  # when the repo has RPC secrets configured, and skip cleanly otherwise rather than
  # failing CI for forks/PRs from contributors who don't have them.
  fork-integration-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    if: ${{ vars.RUN_FORK_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          ETH_RPC_ARCHIVE: ${{ secrets.ETH_RPC_ARCHIVE }}
          BASE_RPC_ARCHIVE: ${{ secrets.BASE_RPC_ARCHIVE }}
