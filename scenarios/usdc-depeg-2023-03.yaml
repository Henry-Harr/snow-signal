# USDC depeg, March 2023 (docs/SPEC.md §9.2 item 1). Tests D10 (peg deviation) and
# the policy-level "alert-only, never auto-exit" rule for a depeg (ADR 0005 — D10 is
# structurally incapable of being standaloneCritical, so this scenario should never
# show a fully-automatic full_exit purely from D10 firing; DANGER/CRITICAL here would
# need corroboration from another signal family too, same as any other detector).
#
# Event narrative and every date/price figure below is sourced and cross-confirmed —
# see docs/SOURCES.md's "Replay scenarios" section for the full citation trail
# (CNN/CNBC/CoinDesk/Decrypt reporting, an independent academic paper covering the
# same event, and CoinGecko's recorded all-time-low price). Every block number below
# was computed directly against the real archive RPC by binary-searching block
# timestamps (2026-09-16) — not estimated from the narrative sources, none of which
# give block-level precision. See docs/SOURCES.md for the exact method and the
# cross-check against the academic paper's own independently-cited block number.
#
# sampleIntervalBlocks is 300 (~1 hour at Ethereum's ~12s/block) — fine enough to
# resolve how the depeg unfolded over its ~36-hour span, coarse enough to keep this a
# few hundred real archive RPC calls rather than tens of thousands (ADR 0009). At this
# stride, each step's governance/pool-flow event fetch window (300 blocks) exceeds the
# ~10-block eth_getLogs free-tier cap (ADR 0009's addendum) — acceptable here since
# this scenario isn't testing D05/D12/D13, only D10.
id: usdc-depeg-2023-03
description: >
  USDC depegs to ~$0.877 on Ethereum after Circle discloses $3.3B of reserves stuck at
  the failed Silicon Valley Bank (March 2023). Tests D10 (peg deviation) and the
  depeg-is-alert-only policy on Aave v3 Ethereum Core USDC.
kind: incident
chain: ethereum
chainId: 1
position:
  protocol: aave-v3
  market: core
  asset: USDC
blockRange:
  from: 16786948 # 2023-03-09T00:00:00Z
  to: 16822491 # 2023-03-14T00:00:00Z
sampleIntervalBlocks: 300
simulatedPositionBalanceRaw: '1000000000000' # 1,000,000 USDC (6 decimals)
groundTruth:
  - at: '2023-03-09T00:00:00.000Z'
    blockNumber: 16786948
    description: 'Silicon Valley Bank closed by California regulators (bank run).'
    pointOfNoReturn: false
  - at: '2023-03-11T03:11:00.000Z'
    blockNumber: 16802088
    description: >
      Circle publicly confirms ~$3.3B of USDC's cash reserves (about 8% of the total)
      is held at the failed SVB.
    pointOfNoReturn: false
  - at: '2023-03-11T06:59:59.000Z'
    blockNumber: 16803216
    description: >
      USDC trades down to its reported low of ~$0.877–0.88 (CoinGecko ATL: $0.8774 on
      2023-03-11) — the depeg's worst point. Reporting places this "by 2am" (ET),
      which this block anchors to; no source gives a more precise minute-level low.
    pointOfNoReturn: true
  - at: '2023-03-12T18:00:00.000Z'
    blockNumber: 16813588
    description: >
      US Treasury, Federal Reserve, and FDIC announce all SVB depositors will be made
      whole — the regulatory intervention that began USDC's recovery.
    pointOfNoReturn: false
sources:
  - url: 'https://www.cnn.com/2023/03/11/business/stablecoin-circle-silicon-valley-bank'
    note: 'CNN: Circle disclosure timeline, USDC falling to $0.87 "by 2am" March 11.'
  - url: 'https://www.cnbc.com/2023/03/11/stablecoin-usdc-breaks-dollar-peg-after-firm-reveals-it-has-3point3-billion-in-svb-exposure.html'
    note: 'CNBC: corroborates the SVB exposure disclosure and depeg.'
  - url: 'https://www.coindesk.com/business/2023/03/11/circle-confirms-33b-of-usdcs-cash-reserves-stuck-at-failed-silicon-valley-bank'
    note: 'CoinDesk: Circle confirmation timing (2023-03-11T03:11 UTC tweet).'
  - url: 'https://decrypt.co/123211/usdc-stablecoin-depegs-90-cents-circle-exposure-silicon-valley-bank'
    note: 'Decrypt: USDC falling to $0.87.'
  - url: 'https://arxiv.org/html/2606.07442v1'
    note: >
      Academic paper studying this exact event ("Tracing Stablecoin Contagion during
      the USDC Depeg after the Silicon Valley Bank Collapse"); independently defines
      the same March 9-13, 2023 window and cites Ethereum block 16,801,144 as its own
      March 11 daily snapshot — 1 block off this scenario's independently-computed
      16,801,143 for the same UTC day, a strong cross-check via a different method.
